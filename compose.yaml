# File ExploraViz — standalone `docker compose` (builds the image from this repository).
# ${...} values come from the .env file (see .env.example).

services:
  file-exploraviz:
    # Image built locally from this repository (docker compose up -d --build).
    # For Dockge on TrueNAS, use the compose file from the README instead (section "Installing
    # on TrueNAS SCALE with Dockge"): the image is built once from the Shell.
    image: ${FEV_IMAGE:-file-exploraviz:local}
    build:
      context: ${FEV_BUILD_CONTEXT:-.}
    container_name: file-exploraviz
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SUPPLEMENTARY_GIDS: ${SUPPLEMENTARY_GIDS:-}
      TZ: ${TZ:-Europe/Paris}
      PORT: ${PORT:-8080}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-15}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - ./config:/config          # configuration (config.yaml)
      - ./cache:/cache            # scan results (YAML) and history
      # Directories to scan: always read-only (:ro), one sub-folder of /data each.
      - /mnt/tank/photos:/data/photos:ro
      - /mnt/tank/documents:/data/documents:ro
      # SMB/CIFS share (see the "volumes" section at the bottom of the file):
      # - nas-smb:/data/share:ro

    # --- Hardening ------------------------------------------------------------
    read_only: true               # read-only container filesystem
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:                      # only to hand /config and /cache to PUID:PGID, then switch to that user
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID

    # --- Indicative resource limits (uncomment if needed) --------------------
    # cpus: "1.0"
    # mem_limit: 768m             # ~300 MB is enough for 1 million indexed files

# --- Example: SMB/CIFS share mounted read-only --------------------------------
# Credentials read from .env (SMB_HOST, SMB_SHARE, SMB_USER, SMB_PASSWORD).
# volumes:
#   nas-smb:
#     driver: local
#     driver_opts:
#       type: cifs
#       device: "//${SMB_HOST}/${SMB_SHARE}"
#       o: "ro,username=${SMB_USER},password=${SMB_PASSWORD},vers=3.0,uid=${PUID:-1000},gid=${PGID:-1000},file_mode=0444,dir_mode=0555,noserverino"
